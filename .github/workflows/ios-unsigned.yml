name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read version
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${V%%+*}" >> $GITHUB_OUTPUT
          echo "build=${V##*+}" >> $GITHUB_OUTPUT
      - name: Native build tools
        run: brew install cmake ninja bazelisk || true
      - name: Cache LiteRT-LM xcframeworks
        id: litert
        uses: actions/cache@v4
        with:
          path: local_plugins/flutter_litert_lm/ios/Frameworks/*.xcframework
          key: litert-${{ runner.os }}-${{ hashFiles('local_plugins/flutter_litert_lm/scripts/build_ios_frameworks.sh') }}
      - name: Build LiteRT-LM xcframeworks
        if: steps.litert.outputs.cache-hit != 'true'
        run: bash local_plugins/flutter_litert_lm/scripts/build_ios_frameworks.sh
      - name: Cache llama.cpp iOS lib
        id: llama
        uses: actions/cache@v4
        with:
          path: local_plugins/llama_flutter_android/ios/llama_ios
          key: llama-ios-${{ hashFiles('local_plugins/llama_flutter_android/scripts/build_llama_ios.sh') }}-${{ hashFiles('local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/CMakeLists.txt') }}
      - name: Build llama.cpp for iOS
        if: steps.llama.outputs.cache-hit != 'true'
        run: bash local_plugins/llama_flutter_android/scripts/build_llama_ios.sh
      - run: flutter pub get
      - name: Pod install
        run: cd ios && pod install --repo-update
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry PrivateLM.ipa Payload
          ls -l PrivateLM.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-${{ steps.ver.outputs.name }}-ipa
          path: PrivateLM.ipa
      - name: Publish to IPA source repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/privatelm-ipa-source
          token: ${{ secrets.IPA_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}
          name: PrivateLM ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.build }})
          body: Unsigned iOS build of ${{ github.repository }}@${{ github.sha }} for sideloading.
          files: PrivateLM.ipa
          make_latest: true
      - name: Update apps.json in source repo
        env:
          GH_TOKEN: ${{ secrets.IPA_REPO_TOKEN }}
          VNAME: ${{ steps.ver.outputs.name }}
          VBUILD: ${{ steps.ver.outputs.build }}
        run: |
          SIZE=$(stat -f%z PrivateLM.ipa)
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/privatelm-ipa-source src
          cd src
          python3 - "$SIZE" <<'PY'
          import json,sys,os,datetime
          d=json.load(open('apps.json'));a=d['apps'][0]
          n,b=os.environ['VNAME'],os.environ['VBUILD']
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY_OWNER']}/privatelm-ipa-source/releases/download/v{n}-{b}/PrivateLM.ipa"
          v={"version":n,"buildVersion":b,"date":datetime.date.today().isoformat(),"downloadURL":url,"size":int(sys.argv[1]),"minOSVersion":"16.2"}
          a['versions']=[v]+[x for x in a['versions'] if x.get('downloadURL')!=url]
          a.update(version=n,versionDate=v['date'],downloadURL=url,size=v['size'])
          json.dump(d,open('apps.json','w'),indent=2)
          PY
          git -c user.name=github-actions -c user.email=actions@github.com commit -am "apps.json: v${VNAME}-${VBUILD}" && git push || echo "no change"
